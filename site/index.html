      "s2_title": "§ 2 Grundsatz",
      "s2_p1": "Hora wurde nach dem Prinzip „Local-First“ entwickelt. Das bedeutet: Alle Daten, die du in der App eingibst, werden auf deinem Endgerät gespeichert. Ein Konto ist freiwillig. Ohne Konto überträgt die App deine Einträge an keinen Server des Anbieters. Mit Konto lädt sie eine Kopie von Stundenplan, Vorname und Profilbild hoch, die sie vorher auf deinem Gerät verschlüsselt, siehe § 3 f). Dienste Dritter erhalten Daten nur, wenn du eine Funktion nutzt, die sie braucht, etwa den Fahrplan oder das Wetter. Einige Anfragen stellt die App außerdem von selbst, zum Beispiel die Frage nach Updates. Welche Dienste das sind, steht in § 3.",
      "s2_p2": "Personenbezogene Daten verarbeitet der Anbieter über die App nur, wenn du ein Konto anlegst (§ 3 f). Sonst gehen Daten nur an die Dienste, die eine Funktion braucht (z. B. ÖPNV-Echtzeitdaten), oder an die in § 3 d) genannten Stellen, wenn die App von selbst eine Anfrage stellt.",
      "s3_title": "§ 3 Datenverarbeitung in der App",
      "s3_sub1_title": "a) Lokal gespeicherte Daten",
      "s3_sub1_p1": "Sämtliche von dir eingegebenen Daten (Stundenpläne, Noten, Aufgaben, Trainingsdaten, Notizen etc.) werden auf deinem Gerät gespeichert. Mit Konto kommt für Stundenplan, Vorname und Profilbild eine verschlüsselte Kopie dazu, siehe f). Zugangsdaten, etwa für IServ und E-Mail, speichert die App verschlüsselt. In den Apps für Computer gilt das auch für Noten, Hausaufgaben, Tests, Klausuren, Vorträge, Termine, Notizen, Mail-Entwürfe, gespeicherte Orte und den Verlauf des Assistenten. Unverschlüsselt in einer lokalen Datenbank liegen dort der Stundenplan mit Fächern, Lehrkräften, Räumen und Zeiten, die Aufgabenliste, Trainingsdaten, Pomodoro-Statistik, Rückblicke, Lesezeichen, Tickets und die Einstellungen, zu denen auch Geburtstag und Wetterort gehören. Auch der zwischengespeicherte Vertretungsplan liegt dort unverschlüsselt. Auf Android und in der Web-App liegen alle Daten außer den Zugangsdaten unverschlüsselt. Der Anbieter hat zu keinem Zeitpunkt Zugriff auf diese Daten. Das gilt auch für die verschlüsselte Kopie im Konto, siehe f).",
      "s3_sub2_title": "b) ÖPNV-Echtzeitdaten",
      "s3_sub2_p1": "Wenn du die Fahrplanfunktion nutzt, sendet die App Anfragen an Transitous (api.transitous.org), für Ticketpreise in Berlin und Brandenburg an transport.rest (v6.vbb.transport.rest). Übermittelt werden die Haltestellen, Adressen und Uhrzeiten deiner Suche. Hast du dein Zuhause oder deine Schule als Ort gespeichert, geht für Verbindungen von dort oder dorthin auch deren Lage mit, und mit „In der Nähe“ dein aktueller Standort, wenn du ihn freigibst. In den älteren Ansichten der Computer-App gehen Anfragen außerdem an transport.rest und für Preise an die Deutsche Bahn. Geräte-IDs werden nicht übermittelt.",
      "s3_sub2_p2": "Hast du deine Schule und dein Zuhause als Ort gespeichert, fragt die App außerdem von selbst bei Transitous die nächsten Verbindungen von der Schule nach Hause ab, wenn du zwischen 90 Minuten vor dem Ende deiner letzten Stunde und zwei Stunden danach eine Seite der App öffnest. Dabei geht die Lage beider Orte mit.",
      "s3_sub3_title": "c) Keine Telemetrie",
      "s3_sub3_p1": "Hora enthält keine Analytics, kein Tracking, keine Crash-Reporter und keine Telemetrie. Es werden keinerlei Nutzungsstatistiken erhoben.",
      "s3_sub4_title": "d) Weitere Dienste",
      "s3_sub4_p1": "Die folgenden Dienste erreicht die App, wenn du die jeweilige Funktion nutzt. Die mit „von selbst“ gekennzeichneten Anfragen stellt sie ohne dein Zutun. Wie bei jeder Verbindung sieht der Dienst dabei deine IP-Adresse.",

      "s3_list15": "Google (Gmail): deine E-Mail-Adresse und der Code, wenn du ein Konto anlegst oder dein Passwort zurücksetzt. Mehr dazu in f)",
      "s3_sub5_title": "e) Google-Konto",
      "s3_sub5_p1": "In den Apps für Computer kannst du dein Google-Konto verbinden. Hora liest dann über die Schnittstellen von Google deine Kalendereinträge und die Liste deiner Kalender und trägt Termine ein, die du in der App anlegst oder änderst. Schaltest du „Stundenplan und Tests in Google eintragen“ ein, legt die App dafür einen eigenen Kalender an und bearbeitet nur diesen. Auf Gmail greift die App über die Anmeldung mit Google nur in Installationen zu, die dafür eingerichtet sind. Dort kann sie deine Mails lesen, in deinem Namen senden und löschen. Sonst verbindest du Gmail mit einem App-Passwort über deinen E-Mail-Anbieter, wie in d) beschrieben.",
      "s3_sub5_p2": "Diese Daten nutzt die App nur, um sie dir auf deinem Gerät zu zeigen und dort zu bearbeiten. Was du änderst, schreibt sie in dein Google-Konto zurück. Eine Kopie der Kalendereinträge und die Anmeldung bei Google speichert sie verschlüsselt auf deinem Gerät. An Server des Anbieters oder an Dritte gibt die App diese Daten nicht weiter, und sie nutzt sie nicht für Werbung.",
      "s3_sub5_p3": "Trennst du dein Google-Konto in der App unter Einstellungen, Konten, löscht sie die Anmeldung und die Kopie auf deinem Gerät. Die Freigabe selbst widerrufst du jederzeit unter [myaccount.google.com/permissions](https://myaccount.google.com/permissions).",
      "s3_sub5_p4": "Die Nutzung und Übertragung von Informationen, die Hora über Google-APIs erhält, an andere Apps hält sich an die [Google API Services User Data Policy](https://developers.google.com/terms/api-services-user-data-policy), einschließlich der Anforderungen zur eingeschränkten Nutzung (Limited Use requirements).",
      "s3_sub6_title": "f) Konto und Abgleich (Beta)",
      "s3_sub6_p1": "Ab Version 0.6 kannst du ein Konto anlegen. Damit gleicht Hora deinen Stundenplan (Fächer, Lehrkräfte, Räume, Stundenzeiten und A/B-Wochen), deinen Vornamen und dein Profilbild zwischen deinen Geräten ab. Das Konto ist freiwillig, die App funktioniert ohne es genauso. Den Dienst dafür betreibt der Anbieter bei Cloudflare (Cloudflare, Inc., USA). Die Datenbank liegt in Rechenzentren in der EU. Die Anfragen deiner Geräte laufen über das Netz von Cloudflare. Cloudflare ist nach dem EU-US Data Privacy Framework zertifiziert. Mehr dazu in der [Datenschutzerklärung von Cloudflare](https://www.cloudflare.com/privacypolicy/).",
      "s3_sub6_p2": "Zu deinem Konto speichert der Dienst:",
      "s3_list16": "deine E-Mail-Adresse und wann du das Konto angelegt und bestätigt hast",
      "s3_list17": "einen Prüfwert zu deinem Passwort. Das Passwort selbst verlässt dein Gerät nicht: Die App berechnet daraus mit 600.000 PBKDF2-Runden einen Anmeldeschlüssel, und der Dienst speichert davon nur einen HMAC-Wert",
      "s3_list18": "deine verschlüsselten Einträge: die letzten 20 Stände deines Stundenplans und die letzten 3 Stände von Vorname und Profilbild, jeweils mit Größe und Eingangszeit. Ältere Stände löscht der Dienst, sobald ein neuer ankommt",
      "s3_list19": "für jedes angemeldete Gerät eine Sitzung, gespeichert nur als Prüfwert. Sie gilt 30 Tage und endet sofort, wenn du dich abmeldest, dein Passwort zurücksetzt oder dein Konto löschst",
      "s3_list20": "die sechsstelligen Codes zum Bestätigen und Zurücksetzen, nur als HMAC-Wert. Ein Code gilt 10 Minuten",
      "s3_list21": "Zähler gegen Missbrauch: wie oft in einem Zeitfenster von höchstens einer Stunde Codes, Registrierungen, Anmeldungen, Löschversuche und Einträge angefragt wurden, je zu deiner E-Mail-Adresse, deinem Konto oder der IP-Adresse der Anfrage",
      "s3_sub6_p3": "Deine Einträge verschlüsselt die App auf deinem Gerät mit AES-256-GCM, bevor sie sie hochlädt. Den Schlüssel leitet sie aus deinem Passwort ab, er verlässt das Gerät nie. Der Dienst kann deshalb nicht lesen, was in deinem Stundenplan, deinem Vornamen oder deinem Profilbild steht. Er sieht nur, zu welchem Konto ein Eintrag gehört, ob er zum Stundenplan oder zum Profil gehört, wie groß er ungefähr ist (in Schritten von 1 KiB), wann er ankam und wie oft dein Konto Einträge sendet. Wie bei jeder Verbindung sehen Cloudflare und der Dienst außerdem die IP-Adresse deines Geräts.",
      "s3_sub6_p4": "Den Code zum Bestätigen deiner E-Mail-Adresse und zum Zurücksetzen des Passworts schickt der Dienst über Gmail vom Konto horaapp.team@gmail.com. Google erhält dabei deine E-Mail-Adresse, den Code und den Text der Mail. Gmail legt jede verschickte Mail im Ordner „Gesendet“ dieses Kontos ab, und kommt eine Mail nicht an, erhält das Konto die Rückmeldung darüber. Der Dienst setzt die Mail bei Cloudflare zusammen und speichert sie nicht, den Code behält er nur als HMAC-Wert. Mehr dazu in der [Datenschutzerklärung von Google](https://policies.google.com/privacy).",
      "s3_sub6_p5": "Auf deinem Gerät speichert die App zum Konto deine E-Mail-Adresse, den Sitzungsschlüssel und den Schlüssel für deine Einträge. Sie gehören nur zu diesem Gerät und kommen in keine Sicherungsdatei.",
      "s3_sub6_p6": "Dein bestätigtes Konto mit E-Mail-Adresse, Prüfwert und Einträgen bleibt, bis du es löschst. Abmelden löscht nichts in der Cloud. Setzt du dein Passwort zurück, löscht der Dienst alle Einträge und beendet alle Sitzungen, und deine Geräte laden ihren Stand danach neu hoch. Alles andere räumt der Dienst jede Stunde auf, mit diesen Fristen: ein nie bestätigtes Konto 7 Tage nach der letzten Registrierung, spätestens eine Stunde danach oder, falls dann noch ein Code gilt, eine Stunde nach dessen Ablauf; einen Code, sobald er benutzt oder ersetzt ist, sonst spätestens etwa 2 Stunden nach dem Versand; eine Sitzung spätestens eine Stunde nach Ablauf ihrer 30 Tage; die Zähler gegen Missbrauch spätestens 2 Stunden nach Beginn ihres Zeitfensters; den Tageszähler für alle Code-Mails zusammen, der keine personenbezogenen Daten enthält, nach spätestens einem Tag und einer Stunde.",
      "s3_sub6_p7": "Zwei Dinge liegen außerhalb dieser Fristen. Die Datenbank bei Cloudflare führt 7 Tage lang einen Verlauf, aus dem sich ihr Stand zu einem früheren Zeitpunkt wiederherstellen lässt (D1 Time Travel). Gelöschte Daten stecken deshalb bis zu 7 Tage lang noch in diesem Verlauf. Und die Code-Mails bleiben im Ordner „Gesendet“ des Gmail-Kontos, bis der Anbieter sie dort löscht.",
      "s3_sub6_p8": "Mit „Konto löschen“ in den Einstellungen der App löschst du dein Konto jederzeit selbst. Dazu gibst du dein Passwort ein, und die App schickt dem Dienst wie beim Anmelden nur den daraus berechneten Anmeldeschlüssel. Der Dienst löscht dann sofort dein Konto, alle Einträge, alle Sitzungen, deine Codes und die Zähler zu deiner E-Mail-Adresse und deinem Konto. Zähler, die nur zur IP-Adresse einer Anfrage gehören, löscht er mit den übrigen nach spätestens 2 Stunden. Deine Geräte behalten ihre Daten und melden sich bei ihrer nächsten Anfrage ab.",
      "s3_sub6_p9": "Cloudflare setzt in den Antworten des Dienstes die Kopfzeilen „NEL“ und „Report-To“ (Network Error Logging). Browser, die das unterstützen, melden Cloudflare damit Fehler beim Verbinden mit dem Dienst, etwa die Art des Fehlers, die aufgerufene Adresse und den Zeitpunkt, und Cloudflare sieht dabei die IP-Adresse. Erfolgreiche Verbindungen werden nicht gemeldet.",
      "s3_sub6_p10": "Rechtsgrundlage für das Konto, den Abgleich und die Code-Mails ist Art. 6 Abs. 1 lit. b DSGVO, denn du legst das Konto an, um diesen Dienst zu nutzen. Die Zähler gegen Missbrauch und die übrigen Schutzmaßnahmen beruhen auf Art. 6 Abs. 1 lit. f DSGVO. Das berechtigte Interesse ist, den Dienst und die Konten vor Missbrauch zu schützen.",
      "s4_title": "§ 4 Datenverarbeitung auf der Website",
      "s4_p1": "Beim Besuch unserer Website werden durch den Hosting-Anbieter automatisch technische Zugriffsdaten erfasst (sog. Server-Logfiles). Diese können umfassen:",
      "s4_list1": "IP-Adresse (anonymisiert)",
      "s4_list2": "Datum und Uhrzeit des Zugriffs",
      "s4_list3": "Aufgerufene Seite",
      "s4_list4": "Browsertyp und Betriebssystem",
      "s4_p2": "Diese Daten werden ausschließlich zur Sicherstellung des Betriebs und zur Abwehr von Missbrauch erhoben (Rechtsgrundlage: Art. 6 Abs. 1 lit. f DSGVO, berechtigtes Interesse) und nach kurzer Zeit automatisch gelöscht. Eine Zuordnung zu einzelnen Personen findet nicht statt.",
      "s4_p3": "Die Website wird von Netlify (Netlify, Inc., 101 2nd Street, San Francisco, CA 94105, USA) bereitgestellt. Netlify kann die oben genannten Zugriffsdaten dabei auch in den USA verarbeiten. Netlify ist nach dem EU-US Data Privacy Framework zertifiziert, für das die EU-Kommission ein angemessenes Datenschutzniveau festgestellt hat (Art. 45 DSGVO). Mehr dazu in der [Datenschutzerklärung von Netlify](https://www.netlify.com/privacy/).",
      "s4_p4": "Die Dateien für Windows, Linux und Android liegen auf GitHub (GitHub, Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, USA). Wenn du eine davon lädst, holt dein Browser sie direkt von dort, und GitHub erhält dabei ähnliche Zugriffsdaten, zum Beispiel deine IP-Adresse. Auch GitHub ist nach dem EU-US Data Privacy Framework zertifiziert. Mehr dazu in der [Datenschutzerklärung von GitHub](https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement).",
      "s5_title": "§ 5 Cookies",
      "s5_p1": "Die Website verwendet keine Cookies und keine Analyse-Tools. Deine Spracheinstellung speichert sie nur im Speicher deines Browsers (localStorage).",
      "s6_title": "§ 6 Deine Rechte",
      "s6_p1": "Ohne Konto erhebt der Anbieter über die App keine personenbezogenen Daten, dann gibt es in der Regel nichts, worüber er Auskunft geben könnte. Mit Konto speichert der Dienst die in § 3 f) genannten Daten. Gemäß DSGVO stehen dir folgende Rechte zu:",
      "s6_list1": "Recht auf Auskunft (Art. 15 DSGVO)",
      "s6_list2": "Recht auf Berichtigung (Art. 16 DSGVO)",
      "s6_list3": "Recht auf Löschung (Art. 17 DSGVO)",
      "s6_list4": "Recht auf Einschränkung der Verarbeitung (Art. 18 DSGVO)",
      "s6_list5": "Recht auf Datenübertragbarkeit (Art. 20 DSGVO)",
      "s6_list6": "Widerspruchsrecht (Art. 21 DSGVO)",
      "s6_p2": "Dein Konto löschst du jederzeit selbst mit „Konto löschen“ in den Einstellungen der App. Darüber hinaus hast du das Recht, dich bei einer Datenschutz-Aufsichtsbehörde zu beschweren.",
      "s7_title": "§ 7 Kontakt",
      "s7_p1": "Bei Fragen zum Datenschutz erreichst du den Verantwortlichen unter:",
      "s8_title": "§ 8 Änderungen",
      "s8_p1": "Der Anbieter behält sich vor, diese Datenschutzerklärung jederzeit anzupassen, um sie an geänderte rechtliche Anforderungen oder Funktionsänderungen der App anzupassen. Die aktuelle Fassung ist stets über die Website abrufbar."

    "download_page": {
      "lede": "Hora stays free, even once the beta is over. You don't need an account; you can start right after the download.",
      "name_note": "Version 0.6 is out for every platform. Until September 2026, Hora was called Nexus.",
      "faq_title": "Questions about installing",
      "faq": [
        {
          "q": "Does Hora cost anything?",
          "a": "No. Hora is free for you, and its source code is public on GitHub. There are no paid features or subscriptions."
        },
        {
          "q": "Do I have to type in my timetable?",
          "a": "Yes, once. Hora can't fetch it from IServ or WebUntis. The setup in the app walks you through it in a few minutes, and if someone in your course has already entered the plan, they can send it to you. Then you only change what's different for you."
        },
        {
          "q": "I already have IServ and WebUntis. What does Hora add?",
          "a": "IServ and WebUntis each know only their own part. Hora shows you on one screen which lesson is next and in which room, and what's left to do before your next test. Hora doesn't know about cancellations in WebUntis, you still see those there."
        },
        {
          "q": "How do I get updates?",
          "a": "On Android, the Mac, Windows and Linux, Hora tells you when a new version is out. You download it here."
        },
        {
          "q": "Why isn't Hora in the App Store or on Google Play?",
          "a": "I distribute Hora directly, without store fees and with faster updates. That's why the iPhone gets the web app."
        },
        {
          "q": "Can I move my data to a new device?",

    "privacy_policy": {
      "nav_title": "Privacy Policy",
      "hero_title": "Privacy Policy",
      "hero_date": "Effective: November 14, 2026",
      "s1_title": "§ 1 Data Controller",
      "s1_p1": "The data controller within the meaning of the General Data Protection Regulation (GDPR) is:",
      "s1_name": "Leon Manuel Töpper",
      "s1_email_label": "Email:",
      "s2_title": "§ 2 Principle",
      "s2_p1": "Hora was built on a \"Local-First\" principle. This means: All data you enter in the App is stored on your device. An account is optional. Without an account, the App transmits your entries to no server of the Provider. With an account, it uploads a copy of your timetable, first name and profile picture, which it encrypts on your device first, see Section 3 f). Third-party services receive data only when you use a feature that needs them, such as transit or weather. The App also makes some requests by itself, for example to check for updates. Section 3 lists these services.",
      "s2_p2": "The Provider processes personal data through the App only if you create an account (Section 3 f). Otherwise data goes only to the services a feature needs (e.g., real-time public transit data), or to those listed in Section 3 d) when the App makes a request by itself.",
      "s3_title": "§ 3 Data Processing in the App",
      "s3_sub1_title": "a) Locally Stored Data",
      "s3_sub1_p1": "All data you enter (timetables, grades, tasks, training data, notes, etc.) is stored on your device. With an account, an encrypted copy of your timetable, first name and profile picture comes along, see f). The App stores login details, for example for IServ and email, in encrypted form. In the apps for computers, this also applies to grades, homework, tests, exams, presentations, events, notes, mail drafts, saved places and the assistant's history. Stored unencrypted in a local database there are the timetable with subjects, teachers, rooms and times, the task list, training data, Pomodoro statistics, reviews, bookmarks, tickets and the settings, which include your birthday and weather location. The cached substitution plan is also stored there unencrypted. On Android and in the web app, all data except the login details is stored unencrypted. The Provider has no access to this data at any time. This also applies to the encrypted copy in the account, see f).",
      "s3_sub2_title": "b) Real-Time Transit Data",
      "s3_sub2_p1": "When you use the transit feature, the App sends requests to Transitous (api.transitous.org) and, for ticket prices in Berlin and Brandenburg, to transport.rest (v6.vbb.transport.rest). These requests contain the stops, addresses and times of your search. If you have saved your home or your school as a place, connections from or to there also include its location, and “In der Nähe” (nearby) includes your current location if you allow it. In the older views of the computer app, requests also go to transport.rest and, for fares, to Deutsche Bahn. No device IDs are transmitted.",
      "s3_sub2_p2": "If you have saved your school and your home as places, the App also asks Transitous by itself for the next connections from school to home when you open a page of the App between 90 minutes before your last lesson ends and two hours after. This includes the location of both places.",
      "s3_sub3_title": "c) No Telemetry",
      "s3_sub3_p1": "Hora contains no analytics, no tracking, no crash reporters, and no telemetry. No usage statistics are collected whatsoever.",
      "s3_sub4_title": "d) Other Services",
      "s3_sub4_p1": "The App contacts the following services when you use the feature in question. It makes the requests marked “by itself” without any action on your part. As with any connection, the service sees your IP address.",
      "s3_list1": "Your school's IServ: your username and password to sign in, then the requests for mail, substitution plan, assignments, events and messages (not in the web app)",
      "s3_list2": "Your email provider: login details and mail, directly via IMAP and SMTP (apps for computers)",
      "s3_list3": "Open-Meteo: the place you want the weather for, or the location of your home",
      "s3_list4": "Holiday services (feiertage-api.de, schulferien-api.de, ferien-api.de, date.nager.at): your federal state",
      "s3_list5": "Wikipedia: the term you ask the assistant about",
      "s3_list6": "Anthropic: your question to the assistant and the data from the App it needs to answer, only if you enter your own Claude key (apps for computers)",
      "s3_list7": "Hugging Face and GitHub: the download of the assistant's language model",
      "s3_list8": "PyPI: the download of the Python packages on the Mac app's first start on Intel Macs and after updates",
      "s3_list9": "This website: the request for the latest version, at start and then every two hours (by itself, apps for computers and Android)",
      "s3_list11": "The websites of your bookmarks: a request to the page, to show its logo next to the bookmark",
      "s3_list12": "This website or GitHub: the download of the new version of the App when you tap “Aktualisieren” (update) in the App (Android)",
      "s3_list13": "Google: your calendar and, where set up, Gmail, when you connect your Google account (apps for computers), see e)",
      "s3_list14": "Hora account at Cloudflare: your email address, a check value for your password and your encrypted entries, only if you create an account or are signed in, see f)",
      "s3_list15": "Google (Gmail): your email address and the code, when you create an account or reset your password, see f)",
      "s3_sub5_title": "e) Google Account",
      "s3_sub5_p1": "In the apps for computers you can connect your Google account. Hora then reads your calendar events and the list of your calendars through Google's APIs and adds the events you create or change in the App. If you switch on “Stundenplan und Tests in Google eintragen” (add timetable and tests to Google), the App creates a calendar of its own for this and edits only that one. The App reaches Gmail through the Google sign-in only in installations set up for it. There it can read your mail, send mail on your behalf and delete it. Otherwise you connect Gmail with an app password through your email provider, as described in d).",
      "s3_sub5_p2": "The App uses this data only to show it to you on your device and to let you edit it there. What you change, it writes back to your Google account. It stores a copy of the calendar events and the Google sign-in encrypted on your device. The App does not pass this data on to the provider's servers or to third parties, and it does not use it for advertising.",
      "s3_sub5_p3": "If you disconnect your Google account in the App under Einstellungen, Konten (Settings, Accounts), it deletes the sign-in and the copy on your device. You can revoke the access itself at any time at [myaccount.google.com/permissions](https://myaccount.google.com/permissions).",
      "s3_sub5_p4": "Hora's use and transfer of information received from Google APIs to any other app will adhere to the [Google API Services User Data Policy](https://developers.google.com/terms/api-services-user-data-policy), including the Limited Use requirements.",
      "s3_sub6_title": "f) Account and Sync (Beta)",
      "s3_sub6_p1": "From version 0.6 you can create an account. With it, Hora keeps your timetable (subjects, teachers, rooms, lesson times and A/B weeks), your first name and your profile picture the same on all your devices. The account is optional, and the App works the same without it. The Provider runs the service for it at Cloudflare (Cloudflare, Inc., USA). The database is kept in data centres in the EU. The requests of your devices pass through Cloudflare's network. Cloudflare is certified under the EU-U.S. Data Privacy Framework. More in [Cloudflare's privacy policy](https://www.cloudflare.com/privacypolicy/).",
      "s3_sub6_p2": "For your account, the service stores:",
      "s3_list16": "your email address and when you created and confirmed the account",
      "s3_list17": "a check value for your password. The password itself never leaves your device: the App derives a sign-in key from it with 600,000 PBKDF2 rounds, and the service stores only an HMAC of that key",
      "s3_list18": "your encrypted entries: the last 20 versions of your timetable and the last 3 versions of your first name and profile picture, each with its size and time of arrival. The service deletes older versions as soon as a new one arrives",
      "s3_list19": "a session for each signed-in device, stored only as a check value. It is valid for 30 days and ends at once when you sign out, reset your password or delete your account",
      "s3_list20": "the six-digit codes for confirming and resetting, only as an HMAC. A code is valid for 10 minutes",
      "s3_list21": "counters against abuse: how often codes, sign-ups, sign-ins, deletion attempts and entries were requested within a window of at most one hour, each tied to your email address, your account or the IP address of the request",
      "s3_sub6_p3": "The App encrypts your entries on your device with AES-256-GCM before it uploads them. It derives the key from your password, and the key never leaves the device. The service therefore cannot read what your timetable, first name or profile picture say. It only sees which account an entry belongs to, whether it belongs to the timetable or the profile, roughly how large it is (in steps of 1 KiB), when it arrived and how often your account sends entries. As with any connection, Cloudflare and the service also see your device's IP address.",
      "s3_sub6_p4": "The service sends the code for confirming your email address and for resetting your password through Gmail from the account horaapp.team@gmail.com. Google receives your email address, the code and the text of the mail. Gmail keeps every mail it sends in that account's Sent folder, and if a mail cannot be delivered, the account receives the bounce. The service puts the mail together at Cloudflare and does not store it, and it keeps the code only as an HMAC. More in [Google's privacy policy](https://policies.google.com/privacy).",
      "s3_sub6_p5": "On your device, the App keeps your email address, the session key and the key for your entries for the account. They belong to this device only and go into no backup file.",
      "s3_sub6_p6": "Your confirmed account with its email address, check value and entries stays until you delete it. Signing out deletes nothing in the cloud. If you reset your password, the service deletes all entries and ends all sessions, and your devices upload their data again afterwards. The service clears everything else every hour, with these deadlines: an account that was never confirmed 7 days after its last sign-up, at the latest one hour later or, if a code for it is still valid then, one hour after that code expires; a code as soon as it is used or replaced, otherwise at the latest about 2 hours after it was sent; a session at the latest one hour after its 30 days run out; the counters against abuse at the latest 2 hours after their window started; the daily count of all code mails together, which holds no personal data, after one day and one hour at the latest.",
      "s3_sub6_p7": "Two things lie outside these deadlines. The database at Cloudflare keeps a history for 7 days from which an earlier state can be restored (D1 Time Travel), so deleted data remains in that history for up to 7 days. And the code mails stay in the Sent folder of the Gmail account until the Provider deletes them there.",
      "s3_sub6_p8": "With “Konto löschen” (delete account) in the App's settings you can delete your account yourself at any time. You enter your password, and as at sign-in the App sends the service only the sign-in key derived from it. The service then deletes your account, all entries, all sessions, your codes and the counters tied to your email address and your account at once. Counters tied only to the IP address of a request go with the others after 2 hours at the latest. Your devices keep their data and sign out at their next request.",
      "s3_sub6_p9": "Cloudflare sets the headers “NEL” and “Report-To” (Network Error Logging) in the service's answers. Browsers that support them report errors in connecting to the service to Cloudflare, such as the kind of error, the address requested and the time, and Cloudflare sees the IP address. Successful connections are not reported.",
      "s3_sub6_p10": "The legal basis for the account, the sync and the code mails is Art. 6(1)(b) GDPR, as you create the account to use this service. The counters against abuse and the other protective measures rest on Art. 6(1)(f) GDPR. The legitimate interest is to protect the service and the accounts against misuse.",
      "s4_title": "§ 4 Data Processing on the Website",
      "s4_p1": "When visiting our Website, the hosting provider automatically collects technical access data (server log files). These may include:",
      "s4_list1": "IP address (anonymized)",
      "s4_list2": "Date and time of access",
      "s4_list3": "Page visited",
      "s4_list4": "Browser type and operating system",
      "s4_p2": "This data is collected solely to ensure operation and prevent misuse (legal basis: Art. 6(1)(f) GDPR, legitimate interest) and is automatically deleted after a short period. No identification of individual persons takes place.",
      "s4_p3": "The Website is hosted by Netlify (Netlify, Inc., 101 2nd Street, San Francisco, CA 94105, USA). Netlify may also process the access data listed above in the USA. Netlify is certified under the EU-U.S. Data Privacy Framework, for which the European Commission has found an adequate level of data protection (Art. 45 GDPR). More in [Netlify's privacy policy](https://www.netlify.com/privacy/).",
      "s4_p4": "The files for Windows, Linux and Android are hosted on GitHub (GitHub, Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, USA). When you download one of them, your browser fetches it directly from there, and GitHub receives similar access data, such as your IP address. GitHub is also certified under the EU-U.S. Data Privacy Framework. More in [GitHub's privacy statement](https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement).",
      "s5_title": "§ 5 Cookies",
      "s5_p1": "The Website uses no cookies and no analytics tools. It stores your language preference only in your browser's storage (localStorage).",
      "s6_title": "§ 6 Your Rights",
      "s6_p1": "Without an account, the Provider collects no personal data through the App, so there is generally nothing to provide information about. With an account, the service stores the data listed in Section 3 f). Under GDPR, you are entitled to the following rights:",
      "s6_list1": "Right of access (Art. 15 GDPR)",
      "s6_list2": "Right to rectification (Art. 16 GDPR)",
      "s6_list3": "Right to erasure (Art. 17 GDPR)",
      "s6_list4": "Right to restriction of processing (Art. 18 GDPR)",
      "s6_list5": "Right to data portability (Art. 20 GDPR)",
      "s6_list6": "Right to object (Art. 21 GDPR)",
      "s6_p2": "You can delete your account yourself at any time with “Konto löschen” (delete account) in the App's settings. You also have the right to lodge a complaint with a data protection supervisory authority.",
      "s7_title": "§ 7 Contact",
      "s7_p1": "For questions regarding data protection, you can reach the data controller at:",
      "s8_title": "§ 8 Changes",
      "s8_p1": "The Provider reserves the right to update this Privacy Policy at any time to reflect changes in legal requirements or App functionality. The current version is always available on the Website."
    },
